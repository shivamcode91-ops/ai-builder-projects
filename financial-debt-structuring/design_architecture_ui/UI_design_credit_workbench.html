<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AICA · Credit workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16283A; --muted:#5D6B7A; --faint:#8A97A5;
  --paper:#F5F7F9; --card:#FFFFFF; --line:#E2E8F0; --line-strong:#CBD5E1;
  --green:#0B6B4F; --red:#B3261E; --amber:#9A5B00; --blue:#1B4E89; --blue-bg:#EAF1F9;
  --axis:#97144D; --axis-dark:#7C0F3F;
  --sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --serif:'IBM Plex Serif',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:var(--sans);cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.topbar{position:sticky;top:0;z-index:40;background:var(--card);border-bottom:1px solid var(--line);
  border-top:3px solid var(--axis);
  display:flex;align-items:center;gap:16px;padding:0 20px;height:56px}
.bankmark{display:flex;align-items:center;gap:9px;flex-shrink:0}
.banklogo{width:27px;height:27px;border-radius:6px;background:var(--axis);color:#fff;
  display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:600;font-size:15px}
.bankmark .bw{line-height:1.2}
.bankmark .bw b{display:block;font-size:13.5px;font-weight:600;letter-spacing:.01em}
.bankmark .bw span{font-size:10px;color:var(--faint);letter-spacing:.07em;text-transform:uppercase}
.sourcetag{font-size:10.5px;color:var(--muted);border:1px solid var(--line);padding:3px 10px;border-radius:12px;white-space:nowrap}
.sourcetag b{color:var(--ink);font-weight:500}
.tabs{display:flex;height:100%}
.tab{border:none;background:none;padding:0 13px;font-size:13px;color:var(--muted);height:100%;
  border-bottom:2px solid transparent;display:flex;align-items:center;gap:7px}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--ink);border-bottom-color:var(--ink);font-weight:500}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
.dot.g{background:var(--green)} .dot.a{background:#C98A00} .dot.r{background:var(--red)}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:12px}
.tele{display:flex;gap:11px;font-size:11px;color:var(--muted)}
.tele b{font-weight:500;color:var(--ink);font-family:var(--mono)}
.btn{border:1px solid var(--line-strong);background:var(--card);border-radius:6px;
  padding:6px 13px;font-size:12.5px;color:var(--ink);font-weight:500}
.btn:hover{background:var(--paper)}
.btn.primary{background:var(--axis);border-color:var(--axis);color:#fff}
.btn.primary:hover{background:var(--axis-dark)}
.btn.quiet{border-color:transparent;color:var(--muted)}
.btn.quiet:hover{color:var(--ink);background:var(--paper)}
.btn.on{background:var(--blue-bg);border-color:var(--blue);color:var(--blue)}
.userchip{display:flex;align-items:center;gap:9px;padding:5px 10px 5px 6px;border:1px solid var(--line);
  border-radius:8px;background:var(--card)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--axis);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;letter-spacing:.03em}

.overlay{position:fixed;inset:0;background:rgba(22,40,58,.45);z-index:70;display:none;
  align-items:center;justify-content:center;padding:20px}
.overlay.show{display:flex}
.modal{background:var(--card);border-radius:12px;width:460px;max-width:94vw;padding:20px 22px;
  box-shadow:0 18px 50px rgba(22,40,58,.25)}
.modal h3{font-family:var(--serif);font-size:17px;font-weight:600;margin-bottom:4px}
.modal .msub{font-size:12px;color:var(--muted);margin-bottom:14px}
.fold{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);
  background:var(--card);border-radius:8px;padding:10px 13px;font-size:12.5px;margin-bottom:7px;font-family:var(--mono)}
.fold:hover{border-color:var(--line-strong);background:var(--paper)}
.fold .fico{color:var(--faint)}
.fold b{font-weight:500}
.fold span.cnt{margin-left:auto;font-size:11px;color:var(--faint)}
.mrow{display:flex;gap:10px;justify-content:flex-end;margin-top:12px;align-items:center}
.mrow .hint{margin-right:auto;font-size:11px;color:var(--faint)}
.plog{font-family:var(--mono);font-size:11.5px;margin-top:6px}
.pline{display:flex;gap:9px;padding:4px 0;color:var(--faint);align-items:baseline}
.pline .pmark{width:14px;flex-shrink:0;text-align:center}
.pline.run{color:var(--ink)}
.pline.done{color:var(--muted)}
.pline.done .pmark{color:var(--green)}
.pline .pcost{margin-left:auto;color:var(--faint);font-size:10.5px}
.pbar{height:4px;background:var(--paper);border-radius:2px;margin:12px 0 4px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--axis);border-radius:2px;width:0%;transition:width .4s}

.scan{position:relative;height:56px;border:1px solid var(--line);border-radius:10px;
  margin:6px 0 12px;overflow:hidden;background:var(--paper)}
.scan .docs{position:absolute;top:0;bottom:0;display:flex;align-items:center;gap:10px;
  padding:0 14px;width:max-content;animation:drift 14s linear infinite}
.sdoc{font-family:var(--mono);font-size:10px;border:1px solid var(--line-strong);
  background:var(--card);border-radius:5px;padding:4px 9px;color:var(--muted);white-space:nowrap}
.scan .beam{position:absolute;top:0;bottom:0;width:110px;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(151,20,77,.16),rgba(151,20,77,.05),transparent);
  border-left:1px solid rgba(151,20,77,.35);animation:beam 1.9s linear infinite}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes beam{from{left:-110px}to{left:100%}}
.cellsanim{display:flex;gap:3px;flex-wrap:wrap;margin:0 0 12px}
.cellsanim i{width:10px;height:14px;border-radius:2px;background:var(--paper);
  border:1px solid var(--line);transition:background .35s,border-color .35s}
.cellsanim i.on{background:#BFE0D0;border-color:#8FC7AC}
.cellsanim i.hot{background:var(--axis);border-color:var(--axis)}
.pline.run .pmark{animation:pulse 1s ease-in-out infinite;color:var(--axis)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.donestamp{display:inline-block;margin-top:12px;border:1.5px solid var(--green);color:var(--green);
  border-radius:4px;padding:6px 14px;font-size:12px;font-weight:600;letter-spacing:.11em;
  text-transform:uppercase;outline:1px solid #BBDCCE;outline-offset:3px;
  opacity:0;transform:scale(.92);transition:opacity .3s,transform .3s}
.donestamp.show{opacity:1;transform:scale(1)}
@media(prefers-reduced-motion:reduce){.scan .docs,.scan .beam,.pline.run .pmark{animation:none}}
.userchip .who{line-height:1.25;text-align:left}
.userchip .who b{display:block;font-size:12px;font-weight:500}
.userchip .who span{font-size:10.5px;color:var(--faint)}
.userchip .caret{color:var(--faint);font-size:10px}

.layout{display:flex;align-items:flex-start}
.main{flex:1;min-width:0;max-width:1080px;margin:0 auto;padding:24px 24px 0}

.memo{display:flex;justify-content:space-between;gap:32px;align-items:flex-start;
  padding:4px 2px 20px;border-bottom:2px solid var(--ink);margin-bottom:16px}
.eyebrow{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.memo h1{font-family:var(--serif);font-weight:600;font-size:29px;line-height:1.15}
.idrow{display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:9px;font-size:12px;color:var(--muted)}
.idrow span b{font-weight:500;color:var(--ink);font-family:var(--mono);font-size:11.5px}
.makerline{margin-top:9px;font-size:11px;color:var(--faint)}
.makerline b{color:var(--muted);font-weight:500}
.memo .right-col{text-align:right;flex-shrink:0}
.stamp{display:inline-block;border:1.5px solid;border-radius:4px;padding:7px 16px 6px;background:var(--card);
  font-size:13px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
  outline:1px solid;outline-offset:3px}
.stamp.approve{color:var(--green);border-color:var(--green);outline-color:#BBDCCE}
.stamp.cond{color:var(--amber);border-color:var(--amber);outline-color:#E8D6AC}
.stamp.decline{color:var(--red);border-color:var(--red);outline-color:#EBC7C4}
.proposed{margin-top:12px;font-size:13px;color:var(--muted)}
.proposed b{color:var(--ink);font-weight:600}
.riskline{margin-top:13px;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.risklabel{font-size:11px;color:var(--faint)}
.risklabel b{font-family:var(--mono);color:var(--ink);font-weight:500}
.riskcells{display:flex;gap:3px}
.riskcells i{width:14px;height:9px;border-radius:2px;background:var(--card);border:1px solid var(--line-strong)}
.riskcells i.on{background:var(--ink);border-color:var(--ink)}

.stripbox{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:12px 18px;display:flex;align-items:center;gap:16px;margin-bottom:10px;flex-wrap:wrap}
.striplabel{font-size:12.5px;color:var(--muted)}
.striplabel b{color:var(--ink);font-weight:600}
.strip{display:flex;gap:3px;flex-wrap:wrap}
.cell{width:11px;height:16px;border-radius:2.5px;background:#EAF2EE;border:1px solid #C9DFD3}
.cell.flag{background:var(--red);border-color:var(--red)}
.cell.fixed{background:var(--card);border:1.5px dashed var(--amber)}
.striplegend{margin-left:auto;display:flex;gap:14px;font-size:11px;color:var(--muted)}
.striplegend i{display:inline-block;width:9px;height:12px;border-radius:2px;margin-right:5px;vertical-align:-2px}

.tray{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:11px 18px;display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.traylabel{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
  font-weight:600;margin-right:6px}
.file{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-family:var(--mono);
  border:1px solid var(--line);border-radius:6px;padding:4px 10px;color:var(--muted);background:var(--card)}
.file b{color:var(--ink);font-weight:400}
.file .st{width:7px;height:7px;border-radius:50%;background:var(--green)}
.file.flagged{border-color:var(--line-strong)}
.file.flagged .st{background:var(--red)}
.traynote{margin-left:auto;font-size:11px;color:var(--faint)}

.exq{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:16px;overflow:hidden}
.exq .exhead{padding:12px 20px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--faint);font-weight:600;display:flex;justify-content:space-between}
.exrow{display:grid;grid-template-columns:96px 1fr;gap:16px;padding:15px 20px;border-bottom:1px solid var(--line);font-size:12.5px}
.exrow:last-child{border-bottom:none}
.sev{align-self:start;justify-self:start;font-size:9.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;
  border:1px solid;border-radius:4px;padding:3px 8px;background:var(--card)}
.sev.red{color:var(--red);border-color:var(--red)}
.sev.amber{color:var(--amber);border-color:var(--amber)}
.exrow .body b{font-weight:600}
.exrow .figs{font-family:var(--mono);font-size:11.5px;margin-top:3px;color:var(--muted)}
.exrow .figs em{font-style:normal;color:var(--red);font-weight:500}
.exrow .res{color:var(--muted);margin-top:5px}
.exrow .res b{color:var(--ink);font-weight:500}
.srcchips{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap}
.srcchip{font-family:var(--mono);font-size:10.5px;padding:2px 8px;border-radius:4px;
  background:var(--paper);border:1px solid var(--line);color:var(--muted)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
@media(max-width:940px){.grid{grid-template-columns:1fr}.memo{flex-direction:column}
  .memo .right-col{text-align:left}.riskline{align-items:flex-start}}
.cardp{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:17px 20px 13px;
  transition:box-shadow .3s,border-color .3s}
.cardp.flash{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-bg)}
.cardp h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);
  font-weight:600;margin-bottom:13px;display:flex;align-items:baseline;gap:10px}
.statust{font-size:11px;letter-spacing:.02em;text-transform:none;font-weight:500;color:var(--muted);
  display:inline-flex;align-items:center;gap:6px;margin-left:auto}
.askmini{border:none;background:none;color:var(--blue);font-size:11px;font-weight:500;
  text-transform:none;letter-spacing:.02em;padding:0}
.askmini:hover{text-decoration:underline}
.bignum{font-family:var(--mono);font-size:26px;font-weight:500}
.bignum small{font-size:13px;color:var(--muted);font-weight:400;margin-left:4px;font-family:var(--sans)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:12.5px;border-top:1px solid var(--line)}
.kv:first-of-type{border-top:none}
.kv .k{color:var(--muted)} .kv .v{font-family:var(--mono);font-size:12px;text-align:right}
.v.good{color:var(--green)} .v.bad{color:var(--red)} .v.warn{color:var(--amber)}
.cardfoot{margin-top:12px;padding-top:8px;border-top:1px solid var(--line);
  font-size:10.5px;color:var(--faint);font-family:var(--mono)}
.rail{position:relative;height:7px;background:#EDF1F5;border-radius:4px;margin:25px 0 22px}
.rail .fill{position:absolute;height:100%;border-radius:4px}
.rail .tick{position:absolute;top:-5px;width:2px;height:17px;background:var(--ink)}
.rail .ticklabel{position:absolute;top:-21px;transform:translateX(-50%);font-size:10.5px;color:var(--muted);font-family:var(--mono);white-space:nowrap}
.rail .marker{position:absolute;top:-6px;width:13px;height:19px;border-radius:3px;transform:translateX(-50%);background:var(--ink)}
.rail .marklabel{position:absolute;top:16px;transform:translateX(-50%);font-size:11px;font-weight:600;font-family:var(--mono);white-space:nowrap}
.bars{display:flex;align-items:flex-end;gap:4px;height:72px;margin:6px 0 4px}
.bars .b{flex:1;background:#C9D8E6;border-radius:2px 2px 0 0;min-height:3px;position:relative}
.bars .b:hover{background:var(--blue)}
.bars .b .tip{display:none;position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;font-size:10px;font-family:var(--mono);padding:2px 7px;border-radius:4px;white-space:nowrap;z-index:5}
.bars .b:hover .tip{display:block}
.axis{display:flex;justify-content:space-between;font-size:10px;color:var(--faint);font-family:var(--mono)}
.stack{display:flex;height:20px;border-radius:5px;overflow:hidden;margin:8px 0 9px}
.stack div{min-width:2px}
.legend{display:flex;gap:13px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
table.data{width:100%;border-collapse:collapse;font-size:12px}
table.data th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
  font-weight:600;text-align:left;padding:0 8px 7px 0;border-bottom:1px solid var(--line-strong)}
table.data th.r,table.data td.r{text-align:right}
table.data td{padding:7px 8px 7px 0;border-bottom:1px solid var(--line)}
table.data td.r{font-family:var(--mono);font-size:11.5px}
table.data tr:last-child td{border-bottom:none}
.spark{display:inline-flex;align-items:flex-end;gap:2px;height:18px;margin-left:8px;vertical-align:middle}
.spark i{width:6px;background:#C9D8E6;border-radius:1px}
.spark i:last-child{background:var(--blue)}
.shold{display:flex;height:13px;border-radius:4px;overflow:hidden;margin:6px 0 8px}

.structure{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:16px}
.structure .head{padding:15px 22px;border-bottom:1px solid var(--line)}
.structure .head h2{font-family:var(--serif);font-size:17.5px;font-weight:600;margin-bottom:5px}
.structure .head .why{font-size:12px;color:var(--muted);max-width:780px;display:block}
.structure .body{padding:6px 22px 16px}
.trow{display:grid;grid-template-columns:150px 1fr auto;gap:14px;padding:10px 0;
  border-bottom:1px solid var(--line);font-size:13px;align-items:baseline}
.trow:last-child{border-bottom:none}
.trow .tk{color:var(--muted);font-size:12px}
.trow .tv{font-weight:500}
.evd{font-size:11px;font-family:var(--mono);color:var(--blue);background:var(--blue-bg);
  border:none;border-radius:4px;padding:3px 9px;white-space:nowrap}
.evd:hover{text-decoration:underline}
.covrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.cov{font-size:11.5px;font-family:var(--mono);padding:4px 11px;border-radius:5px;
  background:var(--paper);border:1px solid var(--line-strong)}
.cplist{margin-top:11px;font-size:12px;color:var(--muted)}
.cplist li{margin-left:18px;padding:2px 0}

.decisionbar{position:sticky;bottom:0;z-index:30;background:var(--card);border:1px solid var(--line-strong);
  border-bottom:none;border-radius:12px 12px 0 0;padding:14px 22px;box-shadow:0 -6px 18px rgba(22,40,58,.07)}
.decisionbar .dtitle{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);
  font-weight:600;margin-bottom:9px}
.decisionbar .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.decisionbar .micro{font-size:11.5px;color:var(--muted);margin-top:8px}
.btn.danger{color:var(--red);border-color:var(--line-strong)}
.btn.danger:hover{border-color:var(--red);background:#FDF7F6}

.footer{font-size:11px;color:var(--faint);text-align:center;padding:14px 0 18px;font-family:var(--mono)}

.qsummary{display:flex;gap:10px;margin:14px 0 16px;flex-wrap:wrap}
.qchip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);
  border-radius:8px;padding:8px 14px;font-size:12.5px;color:var(--muted)}
.qchip b{font-family:var(--mono);color:var(--ink);font-weight:500}
.qtable{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.qhead,.qrow{display:grid;grid-template-columns:120px minmax(180px,1fr) 88px 72px minmax(170px,1.1fr) 88px 84px 26px;
  gap:14px;align-items:center;padding:11px 20px}
.qhead{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:600;
  border-bottom:1px solid var(--line-strong)}
.qrow{border-bottom:1px solid var(--line);cursor:pointer;background:var(--card);width:100%;text-align:left;border-left:none;border-right:none;border-top:none;font-family:var(--sans);font-size:12.5px}
.qrow:last-child{border-bottom:none}
.qrow:hover{background:#FAFBFC}
.qstamp{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  border:1px solid;border-radius:4px;padding:3px 8px;justify-self:start;background:var(--card)}
.qstamp.approve{color:var(--green);border-color:var(--green)}
.qstamp.cond{color:var(--amber);border-color:var(--amber)}
.qstamp.decline{color:var(--red);border-color:var(--red)}
.qco b{display:block;font-weight:600;font-size:13px;color:var(--ink)}
.qco span{font-size:11px;color:var(--faint)}
.qnum{font-family:var(--mono);font-size:12px}
.qprop{font-size:12px;color:var(--muted)}
.qex{font-family:var(--mono);font-size:11.5px}
.qex.has{color:var(--red)}
.qsla{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.qsla.tight{color:var(--amber)}
.qarrow{color:var(--faint)}
.qrow:hover .qarrow{color:var(--ink)}
@media(max-width:940px){.qhead{display:none}.qrow{grid-template-columns:1fr 1fr;row-gap:6px}}
.crumb{border:none;background:none;font-size:12.5px;color:var(--muted);padding:0 4px}
.crumb:hover{color:var(--ink);text-decoration:underline}

.copilot{width:340px;flex-shrink:0;position:sticky;top:54px;height:calc(100vh - 54px);
  background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column}
.copilot.float{position:fixed;right:22px;bottom:22px;top:auto;height:500px;max-height:calc(100vh - 90px);
  width:350px;border:1px solid var(--line-strong);border-radius:14px;overflow:hidden;z-index:55;
  box-shadow:0 12px 40px rgba(22,40,58,.18)}
.copilot.closed{display:none}
.modebtn{border:none;background:none;color:var(--faint);font-size:12px;padding:2px 4px}
.modebtn:hover{color:var(--ink)}
.copilot .dhead{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.copilot .dhead b{font-family:var(--serif);font-size:15px}
.copilot .dhead .scope{font-size:11px;color:var(--faint)}
.copilot .dhead .close{margin-left:auto;border:none;background:none;font-size:15px;color:var(--muted)}
.dmsgs{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:9px}
.msg{max-width:92%;padding:9px 13px;border-radius:10px;font-size:12.5px;line-height:1.55}
.msg.user{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:3px}
.msg.ai{align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:3px}
.msg.ai .cite{display:block;margin-top:6px;font-size:10.5px;color:var(--blue);font-family:var(--mono)}
.dchips{padding:0 15px 10px;display:flex;gap:6px;flex-wrap:wrap}
.dchip{font-size:11.5px;border:1px solid var(--line-strong);background:var(--card);border-radius:14px;padding:5px 12px}
.dchip:hover{background:var(--paper)}
.dinput{display:flex;gap:8px;padding:12px 15px;border-top:1px solid var(--line)}
.dinput input{flex:1;border:1px solid var(--line-strong);border-radius:7px;padding:8px 12px;font-size:13px;font-family:var(--sans)}
.dinput button{border:none;background:var(--ink);color:#fff;border-radius:7px;padding:0 15px;font-weight:500}

.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(8px);z-index:60;
  background:var(--ink);color:#fff;font-size:12.5px;padding:10px 18px;border-radius:8px;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translateX(-50%)}

@media(max-width:1180px){
  .copilot{position:fixed;right:0;top:54px;bottom:0;height:auto;z-index:50;box-shadow:-8px 0 24px rgba(22,40,58,.12)}
}
@media(prefers-reduced-motion:reduce){.toast,.cardp,.copilot{transition:none}}
@media print{
  .topbar,.copilot,.decisionbar,.askmini{display:none!important}
  body{background:#fff}.main{max-width:none;padding:0}
  .cardp,.structure,.stripbox,.exq,.tray{break-inside:avoid;border-color:#999}
}

function runPipeline(key,folderName,nFiles){
  const c=C[key];
  const steps=[
    [`Classifying ${nFiles||c.files.length} files in ${folderName||("data/"+key)}`,"",420],
    [`Parsing Bank_Statement.xlsx · 2,7xx rows`,"0 tokens",650],
    [`Parsing ageing, debt schedule, cashflow model`,"0 tokens",520],
    [`Computing ratios — DSCR, leverage, ICR, DSO`,"0 tokens",430],
    [`Running ${c.checks.total} reconciliation checks`,`${c.checks.flagged} flagged`,700],
    [`Haiku ×5 · extracting small PDFs + sanction scan`,"~11k tok",900],
    [`Sonnet ×1 · structuring call on snapshot + KB`,"~7k tok",950],
    [`Validators — DSCR floor, advance-rate band`,"pass",380],
    [`Memo rebuilt · ${c.tele.tok} tokens · ${c.tele.cost} · ${c.tele.time}`,"",300]
  ];
  const docNames=["Bank_Statement.xlsx","Debtor_Ageing.xlsx","Financial_Statements.pdf","Sanction_Letter.png","Debt_Schedule.xlsx","GST_Returns.pdf","Financial_Model.xlsx","AICA_Report.pdf","Shareholding.pdf"];
  const docChips=docNames.concat(docNames).map(d=>`<span class="sdoc">${d}</span>`).join("");
  const NCELLS=28;
  modal.innerHTML=`<h3>Analysing ${c.tabName}</h3>
    <div class="msub">AICA pipeline v0.3 — deterministic parsers first, models last.</div>
    <div class="scan"><div class="docs">${docChips}</div><div class="beam"></div></div>
    <div class="cellsanim" id="pcells">${Array.from({length:NCELLS},()=>"<i></i>").join("")}</div>
    <div class="pbar"><i id="pbarfill"></i></div>
    <div class="plog" id="plog">${steps.map((s,i)=>
      `<div class="pline" id="pl${i}"><span class="pmark">·</span><span>${s[0]}</span><span class="pcost">${s[1]}</span></div>`).join("")}</div>
    <div style="text-align:center"><span class="donestamp" id="donestamp">Memo ready</span></div>`;
  ov.classList.add("show");
  const cellEls=[...document.getElementById("pcells").children];
  let lit=0;
  function lightCells(upto){
    while(lit<upto&&lit<NCELLS){
      const el=cellEls[lit];el.classList.add("on","hot");
      setTimeout(()=>el.classList.remove("hot"),380);lit++;
    }
  }
  let t=0;
  steps.forEach((s,i)=>{
    t+=s[2];
    setTimeout(()=>{
      const el=document.getElementById("pl"+i);if(!el)return;
      el.classList.add("run");el.querySelector(".pmark").textContent="▸";
      document.getElementById("pbarfill").style.width=Math.round(((i+1)/steps.length)*100)+"%";
      lightCells(Math.round(((i+1)/steps.length)*NCELLS));
      if(i>0){const p=document.getElementById("pl"+(i-1));p.classList.remove("run");p.classList.add("done");p.querySelector(".pmark").textContent="✓";}
      if(i===steps.length-1){
        setTimeout(()=>{
          el.classList.remove("run");el.classList.add("done");el.querySelector(".pmark").textContent="✓";
          lightCells(NCELLS);
          document.getElementById("donestamp").classList.add("show");
          setTimeout(()=>{closeRerun();render(key);toast(`Analysis refreshed · ${c.tele.cost} · ${c.tele.time}`);},900);
        },420);
      }
    },t);
  });
}

const cop=document.getElementById("copilot");
function openCopilot(){cop.classList.remove("closed");syncCopBtn();document.getElementById("dtext").focus()}
function toggleCopilot(){cop.classList.toggle("closed");syncCopBtn()}
function toggleFloat(){
  cop.classList.toggle("float");
  document.getElementById("modeBtn").textContent=cop.classList.contains("float")?"⇲ Dock":"⇱ Float";
}
function syncCopBtn(){document.getElementById("copBtn").classList.toggle("on",!cop.classList.contains("closed"))}

function renderChat(reset){
  const c=C[current];
  if(reset){document.getElementById("dmsgs").innerHTML=
    `<div class="msg ai">Assessment loaded for <b>${c.tabName}</b>. Ask why any term or figure was set — answers cite the underlying snapshot fields. The Ask links on each card work too.</div>`;}
  document.getElementById("dchips").innerHTML=c.chat.chips.map(q=>
    `<button class="dchip" onclick="ask('${q.replace(/'/g,"\\'")}')">${q}</button>`).join("");
}
function ask(q){
  openCopilot();
  const box=document.getElementById("dmsgs");
  box.insertAdjacentHTML("beforeend",`<div class="msg user">${q}</div>`);
  const a=C[current].chat.answers[q];
  box.insertAdjacentHTML("beforeend",`<div class="msg ai" style="opacity:.55">…</div>`);
  box.scrollTop=box.scrollHeight;
  setTimeout(()=>{
    box.lastElementChild.remove();
    const ans=a?a.a:"In the working build this routes to the pipeline chat (Sonnet grounded on this company's snapshot). Prototype answers are scripted for the suggested questions and card Ask links.";
    const cite=a?`<span class="cite">↳ ${a.cite}</span>`:"";
    box.insertAdjacentHTML("beforeend",`<div class="msg ai">${ans}${cite}</div>`);
    box.scrollTop=box.scrollHeight;
  },520);
}
document.getElementById("dsend").onclick=()=>{
  const t=document.getElementById("dtext");if(!t.value.trim())return;
  ask(t.value.trim());t.value="";
};
document.getElementById("dtext").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("dsend").click()});

if(window.innerWidth<1180)cop.classList.add("closed");
syncCopBtn();
renderQueue();
</script>
</body>
</html>
